<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Agentic Brain">
  <defs>
    <linearGradient id="ab-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d33"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="ab-ink" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3c4ff"/>
      <stop offset="1" stop-color="#7f81f7"/>
    </linearGradient>
    <radialGradient id="ab-glow" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#8b8dfc" stop-opacity=".32"/>
      <stop offset="1" stop-color="#8b8dfc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#ab-tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#ab-glow)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
  <g transform="translate(256 266) scale(.86) translate(-256 -266)">
    <!-- two lobes; the notches where they meet read as the hemisphere divide -->
    <g fill="none" stroke="url(#ab-ink)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
      <path d="M244 118c-34-22-86-10-98 32-40 6-62 46-46 82-26 22-26 66 2 88-6 42 28 76 70 72 14 26 46 36 72 22"/>
      <path d="M268 118c34-22 86-10 98 32 40 6 62 46 46 82 26 22 26 66-2 88 6 42-28 76-70 72-14 26-46 36-72 22"/>
    </g>
    <path d="M256 150v236" fill="none" stroke="url(#ab-ink)" stroke-width="26" stroke-linecap="round" opacity=".9"/>
    <!-- a small network: three nodes, fully connected -->
    <path d="M190 232L322 232L256 324Z" fill="none" stroke="#ededef" stroke-opacity=".85" stroke-width="16" stroke-linejoin="round"/>
    <g fill="#ffffff">
      <circle cx="190" cy="232" r="26"/>
      <circle cx="322" cy="232" r="26"/>
      <circle cx="256" cy="324" r="26"/>
    </g>
  </g>
</svg>
